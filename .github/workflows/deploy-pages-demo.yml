name: Deploy public CRM demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tracked files
        run: node scripts/check-public-demo.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public demo
        run: npm run build:demo

      - name: Check Pages artifact
        run: node scripts/check-public-demo.mjs --dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Check Pages publishing source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"

          case "$status" in
            200)
              if jq -e '.build_type == "workflow"' "$response" >/dev/null; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "::notice::Set the Pages publishing source to GitHub Actions to deploy this artifact."
              fi
              ;;
            404)
              echo "::notice::Pages is unavailable or disabled. The build artifact is available in Actions."
              ;;
            *)
              echo "::error::GitHub Pages lookup failed with HTTP $status."
              exit 1
              ;;
          esac

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages-enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
